# Override file to enable Keycloak SSO authentication.
# Usage: docker compose -f docker-compose.yml -f docker-compose.keycloak.yml up --build
#
# This switches from dev auth (no login screen) to Keycloak SSO (login required).
# The portal serves the HRIS-native sign-in page and delegates SSO via core `/auth/sso/*`.
# Log in with any seeded users (see README.md for credentials).

services:
  hris-core-api:
    environment:
      AUTH_MODE: keycloak
      USE_STUB_DATA: "true"

  portal:
    build:
      args:
        VITE_AUTH_MODE: keycloak
