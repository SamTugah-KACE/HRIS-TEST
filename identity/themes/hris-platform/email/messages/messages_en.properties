executeActionsSubject=Action required for your HRIS account
executeActionsBody=Hello,\n\nAn administrator requested the following security action for your {2} account: {3}.\n\nComplete the action securely using this link:\n{0}\n\nThis link expires in {4}. If you did not expect this request, do not use the link and contact your HRIS support team.\n\nFor your security, never share your password or this link.
executeActionsBodyHtml=<div style="color:#172033;font-family:Arial,sans-serif;font-size:16px;line-height:1.6"><h1 style="color:#073b6f;font-size:24px;line-height:1.3;margin:0 0 20px">Account action required</h1><p>Hello,</p><p>An administrator requested the following security action for your <strong>{2}</strong> account: <strong>{3}</strong>.</p><p style="margin:26px 0"><a href="{0}" style="display:inline-block;background:#0b63a9;color:#ffffff;text-decoration:none;font-weight:bold;padding:13px 22px;border-radius:6px">Continue securely</a></p><p>This link expires in <strong>{4}</strong>. If you did not expect this request, do not use the link and contact your HRIS support team.</p><p style="color:#3f4b5f;font-size:14px;border-top:1px solid #dfe5ee;margin-top:26px;padding-top:18px">For your security, never share your password or this link.</p></div>
passwordResetSubject=Reset your HRIS password
passwordResetBody=Hello,\n\nWe received a request to reset the password for your {2} account.\n\nReset it securely using this link:\n{0}\n\nThis link expires in {3}. If you did not request a password reset, ignore this email and your password will remain unchanged.
passwordResetBodyHtml=<div style="color:#172033;font-family:Arial,sans-serif;font-size:16px;line-height:1.6"><h1 style="color:#073b6f;font-size:24px;line-height:1.3;margin:0 0 20px">Reset your password</h1><p>Hello,</p><p>We received a request to reset the password for your <strong>{2}</strong> account.</p><p style="margin:26px 0"><a href="{0}" style="display:inline-block;background:#0b63a9;color:#ffffff;text-decoration:none;font-weight:bold;padding:13px 22px;border-radius:6px">Reset password securely</a></p><p>This link expires in <strong>{3}</strong>. If you did not request a password reset, ignore this email and your password will remain unchanged.</p></div>
emailVerificationSubject=Verify your HRIS email address
emailVerificationBody=Hello,\n\nVerify the email address for your {2} account using this link:\n{0}\n\nThis link expires in {3}. If you did not create this account, ignore this email and contact your HRIS support team.
emailVerificationBodyHtml=<div style="color:#172033;font-family:Arial,sans-serif;font-size:16px;line-height:1.6"><h1 style="color:#073b6f;font-size:24px;line-height:1.3;margin:0 0 20px">Verify your email address</h1><p>Hello,</p><p>Verify the email address for your <strong>{2}</strong> account.</p><p style="margin:26px 0"><a href="{0}" style="display:inline-block;background:#0b63a9;color:#ffffff;text-decoration:none;font-weight:bold;padding:13px 22px;border-radius:6px">Verify email address</a></p><p>This link expires in <strong>{3}</strong>. If you did not create this account, ignore this email and contact your HRIS support team.</p></div>
emailUpdateConfirmationSubject=Confirm your new HRIS email address
emailUpdateConfirmationBody=Hello,\n\nConfirm {1} as the new email address for your {2} account using this link:\n{0}\n\nThis link expires in {3}. If you did not request this change, ignore this email and contact your HRIS support team.
emailUpdateConfirmationBodyHtml=<div style="color:#172033;font-family:Arial,sans-serif;font-size:16px;line-height:1.6"><h1 style="color:#073b6f;font-size:24px;line-height:1.3;margin:0 0 20px">Confirm your new email address</h1><p>Hello,</p><p>Confirm <strong>{1}</strong> as the new email address for your <strong>{2}</strong> account.</p><p style="margin:26px 0"><a href="{0}" style="display:inline-block;background:#0b63a9;color:#ffffff;text-decoration:none;font-weight:bold;padding:13px 22px;border-radius:6px">Confirm email change</a></p><p>This link expires in <strong>{3}</strong>. If you did not request this change, ignore this email and contact your HRIS support team.</p></div>
