services:
  postgres-tenant-registry:
    image: postgres:15
    container_name: postgres-tenant-registry
    restart: unless-stopped
    environment:
      POSTGRES_DB: hris_tenant_registry
      POSTGRES_USER: hris_tenant_registry
      # Purpose: Secret/configuration for postgres password; inject securely and never commit a real value.
      POSTGRES_PASSWORD: ${TENANT_REGISTRY_DB_PASSWORD}
    volumes:
      - tenant_registry_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TENANT_REGISTRY_DB_USER:-hris_tenant_registry} -d hris_tenant_registry"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks:
      - hris_net

  tenant-registry-service:
    build:
      context: ../apps/backend/tenant-registry-service
      dockerfile: Dockerfile
    container_name: tenant-registry-service
    restart: unless-stopped
    environment:
      # Purpose: Network location used for database url.
      DATABASE_URL: postgresql://hris_tenant_registry:${TENANT_REGISTRY_DB_PASSWORD}@postgres-tenant-registry:5432/hris_tenant_registry
      # Purpose: Configures internal basic auth username.
      INTERNAL_BASIC_AUTH_USERNAME: ${TENANT_REGISTRY_BASIC_AUTH_USERNAME}
      # Purpose: Secret/configuration for internal basic auth password; inject securely and never commit a real value.
      INTERNAL_BASIC_AUTH_PASSWORD: ${TENANT_REGISTRY_BASIC_AUTH_PASSWORD}
    depends_on:
      postgres-tenant-registry:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - hris_net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: keycloak
    restart: unless-stopped
    command: >
      start --optimized
      --http-port=8080
    environment:
      # Purpose: Configures keycloak admin.
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      # Purpose: Secret/configuration for keycloak admin password; inject securely and never commit a real value.
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      # Purpose: Network location used for kc db url host.
      KC_DB_URL_HOST: ${KEYCLOAK_DB_HOST}
      # Purpose: Configures kc db url database.
      KC_DB_URL_DATABASE: ${KEYCLOAK_DB_NAME}
      # Purpose: Configures kc db username.
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      # Purpose: Secret/configuration for kc db password; inject securely and never commit a real value.
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_PROXY: edge
      # Purpose: Configures kc hostname.
      KC_HOSTNAME: ${KEYCLOAK_EXTERNAL_HOSTNAME}
    volumes:
      - ../identity/themes/hris-platform:/opt/keycloak/themes/hris-platform:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080; echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200\\|UP' <&3"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - hris_net

  hris-core-api:
    build:
      context: ../apps/backend/hris-core-api
      dockerfile: Dockerfile
    container_name: hris-core-api
    restart: unless-stopped
    environment:
      # Keycloak
      # Purpose: Configures keycloak issuer.
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      # Purpose: Network location used for keycloak jwks url.
      KEYCLOAK_JWKS_URL: ${KEYCLOAK_JWKS_URL}
      # Purpose: Configures keycloak audience hris core.
      KEYCLOAK_AUDIENCE_HRIS_CORE: ${KEYCLOAK_AUDIENCE_HRIS_CORE}

      # Tenant Registry
      TENANT_REGISTRY_BASE_URL: http://tenant-registry-service:8000
      TENANT_REGISTRY_TIMEOUT_SECONDS: 5
      # Purpose: Configures tenant registry basic auth username.
      TENANT_REGISTRY_BASIC_AUTH_USERNAME: ${TENANT_REGISTRY_BASIC_AUTH_USERNAME}
      # Purpose: Secret/configuration for tenant registry basic auth password; inject securely and never commit a real value.
      TENANT_REGISTRY_BASIC_AUTH_PASSWORD: ${TENANT_REGISTRY_BASIC_AUTH_PASSWORD}

      # External module hosts (prod/stage URLs)
      # Purpose: Network location used for srms base url.
      SRMS_BASE_URL: ${SRMS_BASE_URL}                          # e.g. https://srms.gi-kace.com.gh
      # Purpose: Configures eappraisal domain template.
      EAPPRAISAL_DOMAIN_TEMPLATE: ${EAPPRAISAL_DOMAIN_TEMPLATE}# e.g. https://appraisal.{subdomain}.com.gh
      # Purpose: Configures eleave domain template.
      ELEAVE_DOMAIN_TEMPLATE: ${ELEAVE_DOMAIN_TEMPLATE}        # e.g. https://{subdomain}.eleave.com.gh

      HTTP_CLIENT_TIMEOUT_SECONDS: 5
    depends_on:
      tenant-registry-service:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - hris_net

  hris-gateway:
    build:
      context: ../apps/backend/gateway
      dockerfile: Dockerfile
    container_name: hris-gateway
    restart: unless-stopped
    environment:
      # Purpose: Configures app env.
      APP_ENV: ${HRIS_GATEWAY_APP_ENV:-production}
      CORE_API_BASE_URL: http://hris-core-api:8000
      CORE_API_TIMEOUT_SECONDS: 15
      # Purpose: Configures cors allowed origins.
      CORS_ALLOWED_ORIGINS: ${HRIS_GATEWAY_CORS_ALLOWED_ORIGINS}
    depends_on:
      hris-core-api:
        condition: service_healthy
    networks:
      - hris_net

  portal:
    build:
      context: ../apps/frontend/portal
      dockerfile: Dockerfile
    container_name: hris-portal
    restart: unless-stopped
    environment:
      # The portal itself will use these to talk to hris-core-api and keycloak
      # Purpose: Network location used for react app hris core api base url.
      REACT_APP_HRIS_CORE_API_BASE_URL: ${HRIS_CORE_API_PUBLIC_BASE_URL}
      # Purpose: Network location used for react app keycloak url.
      REACT_APP_KEYCLOAK_URL: ${KEYCLOAK_PUBLIC_BASE_URL}
      # Purpose: Configures react app keycloak realm.
      REACT_APP_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      # Purpose: Configures react app keycloak client id.
      REACT_APP_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_PORTAL_CLIENT_ID}
    depends_on:
      hris-core-api:
        condition: service_healthy
    networks:
      - hris_net

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: hris-pgadmin
    restart: unless-stopped
    environment:
      # Purpose: Configures pgadmin default email.
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@hris.local}
      # Purpose: Secret/configuration for pgadmin default password; inject securely and never commit a real value.
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
    ports:
      - "5050:80"
    depends_on:
      postgres-tenant-registry:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - hris_net

  nginx:
    image: nginx:1.27-alpine
    container_name: hris-nginx
    restart: unless-stopped
    volumes:
      - ./nginx/hris-portal.conf:/etc/nginx/conf.d/hris-portal.conf:ro
      - ./nginx/hris-core-api.conf:/etc/nginx/conf.d/hris-core-api.conf:ro
      - ./nginx/keycloak.conf:/etc/nginx/conf.d/keycloak.conf:ro
    ports:
      - "80:80"
      # In production you would terminate TLS (443) either here or in front of this reverse proxy
    depends_on:
      - portal
      - hris-core-api
      - keycloak
    networks:
      - hris_net

networks:
  hris_net:
    driver: bridge

volumes:
  tenant_registry_db_data:
  pgadmin_data:
